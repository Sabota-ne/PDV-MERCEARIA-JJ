              {!detalhe.cancelada && (
                <button className="btn btn-primary" onClick={() => abrirEditarCompra(detalhe)} style={{ flex: 1 }}>
                  ✏️ Alterar
                </button>
              )}
              {!detalhe.cancelada && (
                <button className="btn btn-danger" onClick={() => setConfirmCancelar(detalhe)} style={{ flex: 1 }}>
                  🚫 Cancelar
                </button>
              )}
              <button className="btn btn-ghost" onClick={() => setDetalhe(null)} style={{ flex: 1 }}>Fechar</button>
            </div>
          </div>
        </div>
      )}

      {/* ════ MODAL CONFIRMAR CANCELAMENTO ════ */}
      {confirmCancelar && (
        <div className="modal-overlay" style={{ zIndex: 300 }}>
          <div className="modal" style={{ maxWidth: 400 }}>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 12, color: "#e05260" }}>🚫 Cancelar Compra?</div>
            <div style={{ fontSize: 13, color: "#a0a8c0", marginBottom: 6, lineHeight: 1.6 }}>
              Esta ação vai <strong style={{ color: "#e8eaf0" }}>estornar o estoque</strong> de todos os produtos dessa compra.
            </div>
            <div style={{ background: "#2e1018", borderRadius: 8, padding: 12, marginBottom: 16, fontSize: 12 }}>
              {(confirmCancelar.itens || []).map((i,idx) => (
                <div key={idx} style={{ color: "#e05260" }}>- {i.nome}: -{i.qty} unid.</div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-danger" onClick={() => cancelarCompra(confirmCancelar)} style={{ flex: 1 }}>Confirmar Cancelamento</button>
              <button className="btn btn-ghost" onClick={() => setConfirmCancelar(null)} style={{ flex: 1 }}>Voltar</button>
            </div>
          </div>
        </div>
      )}

      {/* ════ MODAL NOVA COMPRA ════ */}
      {showForm && (
        <div className="modal-overlay">
          <div className="modal" style={{ maxWidth: 580 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 18 }}>{editandoCompra ? "✏️ Editar Compra #" + editandoCompra.id : "📦 Nova Compra"}</div>

            <div className="grid2" style={{ marginBottom: 14 }}>
              <div>
                <div className="label">Fornecedor cadastrado</div>
                <select className="input" value={fornecedorSel} onChange={e => { setFornecedorSel(e.target.value); setFornecedorTexto(""); }}>
                  <option value="">Selecione ou digite abaixo...</option>
                  {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                </select>
              </div>
              <div>
                <div className="label">Ou digite o nome</div>
                <input className="input" value={fornecedorTexto} onChange={e => { setFornecedorTexto(e.target.value); setFornecedorSel(""); }} placeholder="Nome do fornecedor" disabled={!!fornecedorSel} />
              </div>
            </div>

            <div className="grid2" style={{ marginBottom: 14 }}>
              <div>
                <div className="label">Nota Fiscal (opcional)</div>
                <input className="input" value={notaFiscal} onChange={e => setNotaFiscal(e.target.value)} placeholder="Número da NF" />
              </div>
              <div>
                <div className="label">Observações</div>
                <input className="input" value={obs} onChange={e => setObs(e.target.value)} placeholder="Ex: entrega parcial..." />
              </div>
            </div>

            <div style={{ background: "#11141e", borderRadius: 10, padding: 14, marginBottom: 14 }}>
              <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 12, color: "#a0a8c0" }}>Adicionar Produto</div>

              {/* Busca de produto com lista filtrada */}
              <div style={{ marginBottom: 10, position: "relative" }}>
                <div className="label">Produto</div>
                <input
                  className="input"
                  placeholder="🔍 Digite para buscar..."
                  value={prodBusca}
                  onChange={e => { setProdBusca(e.target.value); setShowProdLista(true); setProdSel(""); }}
                  onFocus={() => setShowProdLista(true)}
                  style={{ fontWeight: prodSel ? 600 : 400, color: prodSel ? "#e8eaf0" : "#a0a8c0" }}
                />
                {showProdLista && prodBusca && (
                  <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#1a1d27", border: "1px solid #2a2f45", borderRadius: 8, zIndex: 50, maxHeight: 200, overflowY: "auto", marginTop: 2 }}>
                    {data.produtos
                      .filter(p => p.nome.toLowerCase().includes(prodBusca.toLowerCase()))
                      .slice(0, 12)
                      .map(p => (
                        <div key={p.id} onClick={() => {
                          setProdSel(String(p.id));
                          setProdBusca(p.nome);
                          setCustoSel(p.custo || "");
                          setShowProdLista(false);
                        }} style={{ padding: "9px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid #22263a", display: "flex", justifyContent: "space-between" }}
                          onMouseEnter={e => e.currentTarget.style.background = "#22263a"}
                          onMouseLeave={e => e.currentTarget.style.background = ""}
                        >
                          <span>{p.nome}</span>
                          <span style={{ color: "#6b7499", fontSize: 11 }}>Estoque: {p.estoque}</span>
                        </div>
                      ))
                    }
                    {data.produtos.filter(p => p.nome.toLowerCase().includes(prodBusca.toLowerCase())).length === 0 && (
                      <div style={{ padding: "10px 12px", fontSize: 13, color: "#6b7499" }}>Nenhum produto encontrado</div>
                    )}
                  </div>
                )}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 8, alignItems: "end" }}>
                <div>
                  <div className="label">Qtd</div>
                  <input type="number" className="input" value={qtdSel} min={1} onChange={(e) => setQtdSel(e.target.value)} />
                </div>
                <div>
                  <div className="label">Custo Unit.</div>
                  <input type="number" className="input" value={custoSel} onChange={(e) => setCustoSel(e.target.value)} placeholder="R$" />
                </div>
                <button className="btn btn-primary" onClick={() => { addItem(); setProdBusca(""); }} style={{ height: 38 }} disabled={!prodSel}>{icons.plus}</button>
              </div>
            </div>

            {itens.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                {itens.map((i) => (
                  <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: "#1a1d27", borderRadius: 8, marginBottom: 6, fontSize: 13 }}>
                    <span style={{ flex: 1 }}>{i.nome}</span>
                    <span style={{ color: "#6b7499", marginRight: 12 }}>{i.qty}x {fmt(i.custo)}</span>
                    <span style={{ fontWeight: 700, color: "#4f8ef7", marginRight: 12 }}>{fmt(i.qty * i.custo)}</span>
                    <button className="btn btn-danger" onClick={() => removeItemForm(i.id)} style={{ padding: "3px 8px" }}>{icons.trash}</button>
                  </div>
                ))}
                <div style={{ textAlign: "right", fontWeight: 700, fontSize: 15, color: "#4f8ef7", marginTop: 8 }}>Total: {fmt(total)}</div>
              </div>
            )}

            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-success" onClick={finalizar} disabled={!itens.length} style={{ flex: 1 }}>✅ Confirmar Compra</button>
              <button className="btn btn-ghost" onClick={() => { setShowForm(false); setEditandoCompra(null); setItens([]); setFornecedorSel(""); setFornecedorTexto(""); setNotaFiscal(""); setObs(""); setProdBusca(""); setProdSel(""); }} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ════ MODAL FORM FORNECEDOR ════ */}
      {showFornForm && (
        <div className="modal-overlay">
          <div className="modal" style={{ maxWidth: 460 }}>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 18 }}>
              {editForn ? "✏️ Editar Fornecedor" : "🤝 Novo Fornecedor"}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div><div className="label">Nome *</div><input className="input" value={forn.nome} onChange={e => setForn(f => ({...f, nome: e.target.value}))} placeholder="Nome do fornecedor" /></div>
              <div className="grid2">
                <div><div className="label">Telefone</div><input className="input" value={forn.telefone} onChange={e => setForn(f => ({...f, telefone: e.target.value}))} placeholder="(00) 00000-0000" /></div>
                <div><div className="label">CNPJ</div><input className="input" value={forn.cnpj} onChange={e => setForn(f => ({...f, cnpj: e.target.value}))} placeholder="00.000.000/0000-00" /></div>
              </div>
              <div><div className="label">E-mail</div><input className="input" value={forn.email} onChange={e => setForn(f => ({...f, email: e.target.value}))} placeholder="email@fornecedor.com" /></div>
              <div><div className="label">Produtos que fornece</div><input className="input" value={forn.produtos} onChange={e => setForn(f => ({...f, produtos: e.target.value}))} placeholder="Ex: Bebidas, Laticínios..." /></div>
              <div><div className="label">Observações</div><input className="input" value={forn.obs} onChange={e => setForn(f => ({...f, obs: e.target.value}))} placeholder="Dias de entrega, contato, etc." /></div>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <button className="btn btn-success" onClick={salvarForn} style={{ flex: 1 }}>Salvar</button>
              <button className="btn btn-ghost" onClick={() => setShowFornForm(false)} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ════ MODAL CONFIRMAR EXCLUIR FORNECEDOR ════ */}
      {confirmDelForn && (
        <div className="modal-overlay" style={{ zIndex: 300 }}>
          <div className="modal" style={{ maxWidth: 360 }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Excluir fornecedor?</div>
            <div style={{ fontSize: 13, color: "#a0a8c0", marginBottom: 20 }}>
              "<strong style={{ color: "#e8eaf0" }}>{confirmDelForn.nome}</strong>" será removido. As compras já feitas não são afetadas.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-danger" onClick={() => excluirForn(confirmDelForn.id)} style={{ flex: 1 }}>Excluir</button>
              <button className="btn btn-ghost" onClick={() => setConfirmDelForn(null)} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// ABA TAXAS
// ══════════════════════════════════════════════════════════════════
function AbaFinanceiro({ data, update }) {
  const [subAba, setSubAba] = useState("caixa");
  const [showSangriaForm, setShowSangriaForm] = useState(false);
  const [showDespesaForm, setShowDespesaForm] = useState(false);
  const [showAbrirCaixa, setShowAbrirCaixa] = useState(false);
  const [showFecharCaixa, setShowFecharCaixa] = useState(false);
  const [saldoInicialForm, setSaldoInicialForm] = useState("");
  const [saldoFinalForm, setSaldoFinalForm] = useState("");
  const [obsForm, setObsForm] = useState("");
  const [sangriaForm, setSangriaForm] = useState({ valor: "", motivo: "" });
  const [despesaForm, setDespesaForm] = useState({ descricao: "", valor: "", categoria: "Operacional" });

  const CATEGORIAS_DESPESA = ["Aluguel", "Energia", "Água", "Internet", "Funcionário", "Manutenção", "Operacional", "Outros"];

  const hoje = new Date().toDateString();
  const mesAtual = new Date().getMonth();
  const anoAtual = new Date().getFullYear();

  const isMes = (d) => { const dt = new Date(d); return dt.getMonth() === mesAtual && dt.getFullYear() === anoAtual; };
  const isHoje = (d) => new Date(d).toDateString() === hoje;

  const vendasHoje = (data.vendas || []).filter(v => !v.cancelada && isHoje(v.data));
  const vendasMes  = (data.vendas || []).filter(v => !v.cancelada && isMes(v.data));

  const totalVendasHoje   = vendasHoje.reduce((s, v) => s + v.total, 0);
  const totalVendasMes    = vendasMes.reduce((s, v) => s + v.total, 0);
  const totalLiquidoMes   = vendasMes.reduce((s, v) => s + (v.liquido || v.total), 0);

  const custoVendasMes = vendasMes.reduce((s, v) =>
    s + (v.itens || []).reduce((si, i) => {
      const prod = (data.produtos || []).find(p => p.id === i.id);
      return si + (prod ? prod.custo * i.qty : 0);
    }, 0), 0);

  const sangrias  = data.sangrias  || [];
  const despesas  = data.despesas  || [];
  const perdas    = data.perdas    || [];
  const caixas    = data.caixas    || [];

  const totalSangriasMes  = sangrias.filter(s => isMes(s.data)).reduce((s, x) => s + x.valor, 0);
  const totalDespesasMes  = despesas.filter(d => isMes(d.data)).reduce((s, x) => s + x.valor, 0);
  const totalPerdasMes    = perdas.filter(p => isMes(p.data)).reduce((s, x) => s + x.qty * x.custo, 0);

  const fiadoPendente = (data.clientes || []).reduce((s, c) => s + c.saldo, 0);
  const valorEstoque  = (data.produtos || []).reduce((s, p) => s + p.estoque * (p.custo || 0), 0);
  const lucroMes = totalLiquidoMes - custoVendasMes - totalDespesasMes - totalPerdasMes;

  const totalLiquidoHoje = vendasHoje.reduce((s, v) => s + (v.liquido || v.total), 0);
  const custoVendasHoje  = vendasHoje.reduce((s, v) =>
    s + (v.itens || []).reduce((si, i) => {
      const prod = (data.produtos || []).find(p => p.id === i.id);
      return si + (prod ? prod.custo * i.qty : 0);
    }, 0), 0);
  const despesasHoje = despesas.filter(d => isHoje(d.data)).reduce((s, x) => s + x.valor, 0);
  const lucroHoje = totalLiquidoHoje - custoVendasHoje - despesasHoje;

  // Caixa atual aberto
  const caixaAberto = caixas.find(c => !c.fechado);
  const sangriasHoje = sangrias.filter(s => isHoje(s.data)).reduce((s, x) => s + x.valor, 0);

  // Vendas dinheiro/pix desde abertura do caixa atual
  const vendasNoCaixa = caixaAberto
    ? (data.vendas || []).filter(v => !v.cancelada && new Date(v.data) >= new Date(caixaAberto.dataAbertura))
    : vendasHoje;
  const entradasDinheiro = vendasNoCaixa.filter(v => v.pagamento === "dinheiro").reduce((s, v) => s + v.total, 0);
  const entradasPix      = vendasNoCaixa.filter(v => v.pagamento === "pix").reduce((s, v) => s + v.total, 0);
  const sangriasNoCaixa  = caixaAberto
    ? sangrias.filter(s => new Date(s.data) >= new Date(caixaAberto.dataAbertura)).reduce((s, x) => s + x.valor, 0)
    : sangriasHoje;

  const saldoEsperado = caixaAberto
    ? (caixaAberto.saldoInicial || 0) + entradasDinheiro - sangriasNoCaixa
    : 0;

  const caixaEstimado = caixaAberto ? saldoEsperado
    : vendasHoje.filter(v => v.pagamento === "dinheiro").reduce((s, v) => s + v.total, 0)
      - sangrias.filter(s => isHoje(s.data)).reduce((s, x) => s + x.valor, 0);

  // ── Abrir caixa ──────────────────────────────────────────────────
  const abrirCaixa = () => {
    if (caixaAberto) return;
    update((d) => {
      const id = (d.nextId.caixa || 1);
      return {
        ...d,
        caixas: [...(d.caixas || []), { id, saldoInicial: Number(saldoInicialForm) || 0, dataAbertura: new Date().toISOString(), fechado: false }],
        nextId: { ...d.nextId, caixa: id + 1 }
      };
    });
    setSaldoInicialForm("");
    setShowAbrirCaixa(false);
  };

  // ── Fechar caixa ─────────────────────────────────────────────────
  const fecharCaixa = () => {
    if (!caixaAberto) return;
    const saldoFinal = Number(saldoFinalForm) || 0;
    const diferenca = saldoFinal - saldoEsperado;
    update((d) => ({
      ...d,
      caixas: (d.caixas || []).map(c => c.id === caixaAberto.id
        ? { ...c, fechado: true, dataFechamento: new Date().toISOString(), saldoFinal, saldoEsperado, diferenca, obs: obsForm, entradasDinheiro, entradasPix, sangriasNoCaixa }
        : c)
    }));
    setSaldoFinalForm("");
    setObsForm("");
    setShowFecharCaixa(false);
  };

  // ── Registrar sangria ────────────────────────────────────────────
  const registrarSangria = () => {
    if (!sangriaForm.valor || Number(sangriaForm.valor) <= 0) return;
    update((d) => {
      const id = (d.nextId.sangria || 1);
      return {
        ...d,
        sangrias: [...(d.sangrias || []), { id, valor: Number(sangriaForm.valor), motivo: sangriaForm.motivo, data: new Date().toISOString() }],
        nextId: { ...d.nextId, sangria: id + 1 }
      };
    });
    setSangriaForm({ valor: "", motivo: "" });
    setShowSangriaForm(false);
  };

  // ── Registrar despesa ────────────────────────────────────────────
  const registrarDespesa = () => {
    if (!despesaForm.descricao || !despesaForm.valor || Number(despesaForm.valor) <= 0) return;
    update((d) => {
      const id = (d.nextId.despesa || 1);
      return {
        ...d,
        despesas: [...(d.despesas || []), { id, descricao: despesaForm.descricao, valor: Number(despesaForm.valor), categoria: despesaForm.categoria, data: new Date().toISOString() }],
        nextId: { ...d.nextId, despesa: id + 1 }
      };
    });
    setDespesaForm({ descricao: "", valor: "", categoria: "Operacional" });
    setShowDespesaForm(false);
  };

  return (
    <div>
      <div className="section-title">💰 Financeiro</div>

      {/* Sub-abas */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {[["caixa","🏪 Caixa"],["painel","📊 Painel"],["sangria","💸 Sangria"],["despesas","🧾 Despesas"],["pagar","📤 A Pagar"],["receber","📥 A Receber"],["fluxo","📈 Fluxo"],["fiscal","🗂️ Fiscal"]].map(([k,l]) => (
          <button key={k} onClick={() => setSubAba(k)}
            style={{ padding: "8px 16px", borderRadius: 8, fontWeight: 600, fontSize: 13, border: "none", cursor: "pointer",
              background: subAba === k ? "#4f8ef7" : "#1a1d27", color: subAba === k ? "#fff" : "#6b7499" }}>
            {l}
          </button>
        ))}
      </div>

      {/* ── CAIXA ── */}
      {subAba === "caixa" && (
        <div>
          {caixaAberto ? (
            <>
              {/* Status caixa aberto */}
              <div style={{ background: "#0d2318", border: "1.5px solid #22c97a55", borderRadius: 14, padding: 18, marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div>
                    <div style={{ fontSize: 12, color: "#22c97a", fontWeight: 700, marginBottom: 2 }}>🟢 CAIXA ABERTO</div>
                    <div style={{ fontSize: 11, color: "#6b7499" }}>Desde {new Date(caixaAberto.dataAbertura).toLocaleString("pt-BR")}</div>
                  </div>
                  <button className="btn btn-danger" onClick={() => setShowFecharCaixa(true)} style={{ fontSize: 12 }}>
                    🔒 Fechar Caixa
                  </button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {[
                    { label: "SALDO INICIAL", valor: caixaAberto.saldoInicial || 0, cor: "#6b7499" },
                    { label: "ENTRADAS DINHEIRO", valor: entradasDinheiro, cor: "#22c97a" },
                    { label: "SANGRIAS", valor: sangriasNoCaixa, cor: "#e05260" },
                    { label: "SALDO ESPERADO", valor: saldoEsperado, cor: "#4f8ef7" },
                  ].map(({ label, valor, cor }) => (
                    <div key={label} style={{ background: "#11141e", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ fontSize: 10, color: "#6b7499", marginBottom: 3 }}>{label}</div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: cor }}>{fmt(valor)}</div>
                    </div>
                  ))}
                </div>
                {entradasPix > 0 && (
                  <div style={{ marginTop: 10, fontSize: 12, color: "#6b7499" }}>
                    + {fmt(entradasPix)} recebidos via PIX (não entram no caixa físico)
                  </div>
                )}
              </div>
            </>
          ) : (
            <div style={{ background: "#1a1018", border: "1.5px solid #e0526055", borderRadius: 14, padding: 20, marginBottom: 16, textAlign: "center" }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>🔴</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#e05260", marginBottom: 6 }}>Caixa fechado</div>
              <div style={{ fontSize: 13, color: "#6b7499", marginBottom: 16 }}>Abra o caixa para começar o dia</div>
              <button className="btn btn-success" onClick={() => setShowAbrirCaixa(true)} style={{ padding: "12px 24px", fontSize: 14 }}>
                🔓 Abrir Caixa
              </button>
            </div>
          )}

          {/* Histórico de caixas */}
          {caixas.filter(c => c.fechado).length > 0 && (
            <>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7499", marginBottom: 10, letterSpacing: .5 }}>HISTÓRICO</div>
              <div className="card" style={{ padding: 0, overflow: "hidden" }}>
                <table className="table">
                  <thead><tr><th>Data</th><th>Abertura</th><th>Esperado</th><th>Real</th><th>Diferença</th></tr></thead>
                  <tbody>
                    {[...caixas].filter(c => c.fechado).reverse().map(c => (
                      <tr key={c.id}>
                        <td style={{ fontSize: 11, color: "#6b7499", whiteSpace: "nowrap" }}>{new Date(c.dataAbertura).toLocaleDateString("pt-BR")}</td>
                        <td>{fmt(c.saldoInicial || 0)}</td>
                        <td>{fmt(c.saldoEsperado || 0)}</td>
                        <td>{fmt(c.saldoFinal || 0)}</td>
                        <td style={{ fontWeight: 700, color: (c.diferenca || 0) >= 0 ? "#22c97a" : "#e05260" }}>
                          {(c.diferenca || 0) >= 0 ? "+" : ""}{fmt(c.diferenca || 0)}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {/* Modal abrir caixa */}
          {showAbrirCaixa && (
            <div className="modal-overlay">
              <div className="modal" style={{ maxWidth: 360 }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>🔓 Abrir Caixa</div>
                <div style={{ marginBottom: 16 }}>
                  <div className="label">Saldo inicial em caixa (troco)</div>
                  <input type="number" className="input" value={saldoInicialForm} onChange={e => setSaldoInicialForm(e.target.value)} placeholder="R$ 0,00" min={0} step={0.01} autoFocus />
                  <div style={{ fontSize: 11, color: "#6b7499", marginTop: 4 }}>Quanto dinheiro físico tem no caixa agora</div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn btn-success" onClick={abrirCaixa} style={{ flex: 1 }}>Abrir</button>
                  <button className="btn btn-ghost" onClick={() => { setShowAbrirCaixa(false); setSaldoInicialForm(""); }} style={{ flex: 1 }}>Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal fechar caixa */}
          {showFecharCaixa && (
            <div className="modal-overlay">
              <div className="modal" style={{ maxWidth: 400 }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>🔒 Fechar Caixa</div>
                <div style={{ background: "#11141e", borderRadius: 10, padding: 14, marginBottom: 16 }}>
                  <div style={{ fontSize: 12, color: "#6b7499", marginBottom: 2 }}>Saldo esperado no caixa</div>
                  <div style={{ fontSize: 24, fontWeight: 700, color: "#4f8ef7" }}>{fmt(saldoEsperado)}</div>
                  <div style={{ fontSize: 11, color: "#6b7499", marginTop: 4 }}>Saldo inicial + entradas em dinheiro - sangrias</div>
                </div>
                <div style={{ marginBottom: 12 }}>
                  <div className="label">Quanto tem no caixa agora? *</div>
                  <input type="number" className="input" value={saldoFinalForm} onChange={e => setSaldoFinalForm(e.target.value)} placeholder="R$ 0,00" min={0} step={0.01} autoFocus />
                </div>
                {saldoFinalForm && (
                  <div style={{ background: Number(saldoFinalForm) >= saldoEsperado ? "#0d2318" : "#2e1018", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 13 }}>
                    <span style={{ color: "#6b7499" }}>Diferença: </span>
                    <strong style={{ color: Number(saldoFinalForm) >= saldoEsperado ? "#22c97a" : "#e05260" }}>
                      {Number(saldoFinalForm) >= saldoEsperado ? "+" : ""}{fmt(Number(saldoFinalForm) - saldoEsperado)}
                    </strong>
                  </div>
                )}
                <div style={{ marginBottom: 16 }}>
                  <div className="label">Observação (opcional)</div>
                  <input className="input" value={obsForm} onChange={e => setObsForm(e.target.value)} placeholder="Ex: falta de troco, etc." />
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn btn-danger" onClick={fecharCaixa} disabled={!saldoFinalForm} style={{ flex: 1 }}>Fechar Caixa</button>
                  <button className="btn btn-ghost" onClick={() => { setShowFecharCaixa(false); setSaldoFinalForm(""); setObsForm(""); }} style={{ flex: 1 }}>Cancelar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── PAINEL ── */}
      {subAba === "painel" && (
        <div>
          {/* Saúde do Negócio */}
          <div style={{ background: "linear-gradient(135deg, #1a1d27, #11141e)", border: "1px solid #22263a", borderRadius: 14, padding: 18, marginBottom: 16 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#4f8ef7", letterSpacing: 1, marginBottom: 14 }}>⭐ SAÚDE DO NEGÓCIO</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {[
                { label: "CAIXA ESTIMADO (HOJE)", valor: caixaEstimado, cor: "#22c97a", icone: "💵" },
                { label: "FIADO PENDENTE", valor: fiadoPendente, cor: "#e05260", icone: "👥" },
                { label: "VALOR EM ESTOQUE", valor: valorEstoque, cor: "#4f8ef7", icone: "📦" },
                { label: "LUCRO DO MÊS", valor: lucroMes, cor: lucroMes >= 0 ? "#22c97a" : "#e05260", icone: "📈" },
              ].map(({ label, valor, cor, icone }) => (
                <div key={label} style={{ background: "#11141e", borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ fontSize: 10, color: "#6b7499", marginBottom: 4 }}>{icone} {label}</div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: cor }}>{fmt(valor)}</div>
                </div>
              ))}
            </div>
            {/* Lucro do dia */}
            <div style={{ marginTop: 12, padding: "12px 14px", background: "#11141e", borderRadius: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 10, color: "#6b7499", marginBottom: 2 }}>☀️ LUCRO DE HOJE</div>
                <div style={{ fontSize: 11, color: "#6b7499" }}>{vendasHoje.length} venda{vendasHoje.length !== 1 ? "s" : ""} · receita {fmt(totalLiquidoHoje)}</div>
              </div>
              <div style={{ fontSize: 22, fontWeight: 700, color: lucroHoje >= 0 ? "#22c97a" : "#e05260" }}>{fmt(lucroHoje)}</div>
            </div>
          </div>

          {/* Resumo do mês */}
          <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7499", marginBottom: 10, letterSpacing: .5 }}>RESUMO DO MÊS</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
            {[
              { label: "Vendas brutas", valor: totalVendasMes, cor: "#4f8ef7" },
              { label: "Custo dos produtos vendidos", valor: -custoVendasMes, cor: "#e05260" },
              { label: "Despesas fixas", valor: -totalDespesasMes, cor: "#e05260" },
              { label: "Perdas", valor: -totalPerdasMes, cor: "#f0b429" },
              { label: "Sangrias", valor: -totalSangriasMes, cor: "#a78bfa" },
            ].map(({ label, valor, cor }) => (
              <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: "#161923", borderRadius: 8 }}>
                <span style={{ fontSize: 13, color: "#a0a8c0" }}>{label}</span>
                <span style={{ fontWeight: 700, color: cor }}>{valor < 0 ? "- " : ""}{fmt(Math.abs(valor))}</span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", background: "#11141e", borderRadius: 8, border: `1px solid ${lucroMes >= 0 ? "#22c97a44" : "#e0526044"}` }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: "#e8eaf0" }}>Lucro estimado</span>
              <span style={{ fontSize: 18, fontWeight: 700, color: lucroMes >= 0 ? "#22c97a" : "#e05260" }}>{fmt(lucroMes)}</span>
            </div>
          </div>

          {/* Hoje */}
          <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7499", marginBottom: 10, letterSpacing: .5 }}>HOJE</div>
          <div className="grid2" style={{ marginBottom: 8 }}>
            <div className="stat-card"><div style={{ fontSize: 11, color: "#6b7499", marginBottom: 4 }}>VENDAS</div><div style={{ fontSize: 20, fontWeight: 700, color: "#4f8ef7" }}>{fmt(totalVendasHoje)}</div></div>
            <div className="stat-card"><div style={{ fontSize: 11, color: "#6b7499", marginBottom: 4 }}>CAIXA (DINHEIRO/PIX)</div><div style={{ fontSize: 20, fontWeight: 700, color: "#22c97a" }}>{fmt(caixaEstimado)}</div></div>
          </div>
        </div>
      )}

      {/* ── SANGRIA ── */}
      {subAba === "sangria" && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 13, color: "#6b7499" }}>Sangrias do mês</div>
              <div style={{ fontSize: 22, fontWeight: 700, color: "#a78bfa" }}>{fmt(totalSangriasMes)}</div>
            </div>
            <button className="btn btn-primary" onClick={() => setShowSangriaForm(true)} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {icons.plus} Registrar
            </button>
          </div>

          {sangrias.length === 0 ? (
            <div className="card" style={{ textAlign: "center", color: "#6b7499", padding: 40 }}>Nenhuma sangria registrada</div>
          ) : (
            <div className="card" style={{ padding: 0, overflow: "hidden" }}>
              <table className="table">
                <thead><tr><th>Data</th><th>Motivo</th><th>Valor</th></tr></thead>
                <tbody>
                  {[...sangrias].reverse().map(s => (
                    <tr key={s.id}>
                      <td style={{ color: "#6b7499", fontSize: 12 }}>{new Date(s.data).toLocaleDateString("pt-BR")}</td>
                      <td>{s.motivo || "-"}</td>
                      <td style={{ fontWeight: 700, color: "#a78bfa" }}>{fmt(s.valor)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {showSangriaForm && (
            <div className="modal-overlay">
              <div className="modal" style={{ maxWidth: 380 }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>💸 Registrar Sangria</div>
                <div style={{ marginBottom: 12 }}>
                  <div className="label">Valor *</div>
                  <input type="number" className="input" value={sangriaForm.valor} onChange={e => setSangriaForm(f => ({ ...f, valor: e.target.value }))} placeholder="R$" min={0.01} step={0.01} />
                </div>
                <div style={{ marginBottom: 16 }}>
                  <div className="label">Motivo (opcional)</div>
                  <input className="input" value={sangriaForm.motivo} onChange={e => setSangriaForm(f => ({ ...f, motivo: e.target.value }))} placeholder="Ex: pagamento fornecedor, troco..." />
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn btn-primary" onClick={registrarSangria} disabled={!sangriaForm.valor} style={{ flex: 1 }}>Confirmar</button>
                  <button className="btn btn-ghost" onClick={() => { setShowSangriaForm(false); setSangriaForm({ valor: "", motivo: "" }); }} style={{ flex: 1 }}>Cancelar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── DESPESAS ── */}
      {subAba === "despesas" && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 13, color: "#6b7499" }}>Despesas do mês</div>
              <div style={{ fontSize: 22, fontWeight: 700, color: "#e05260" }}>{fmt(totalDespesasMes)}</div>
            </div>
            <button className="btn btn-primary" onClick={() => setShowDespesaForm(true)} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {icons.plus} Nova
            </button>
          </div>

          {despesas.length === 0 ? (
            <div className="card" style={{ textAlign: "center", color: "#6b7499", padding: 40 }}>Nenhuma despesa registrada</div>
          ) : (
            <div className="card" style={{ padding: 0, overflow: "hidden" }}>
              <table className="table">
                <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead>
                <tbody>
                  {[...despesas].reverse().map(d => (
                    <tr key={d.id}>
                      <td style={{ color: "#6b7499", fontSize: 12, whiteSpace: "nowrap" }}>{new Date(d.data).toLocaleDateString("pt-BR")}</td>
                      <td style={{ fontWeight: 500 }}>{d.descricao}</td>
                      <td><span style={{ fontSize: 11, color: "#a78bfa" }}>{d.categoria}</span></td>
                      <td style={{ fontWeight: 700, color: "#e05260" }}>{fmt(d.valor)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {showDespesaForm && (
            <div className="modal-overlay">
              <div className="modal" style={{ maxWidth: 400 }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>🧾 Nova Despesa</div>
                <div style={{ marginBottom: 12 }}>
                  <div className="label">Descrição *</div>
                  <input className="input" value={despesaForm.descricao} onChange={e => setDespesaForm(f => ({ ...f, descricao: e.target.value }))} placeholder="Ex: Conta de energia de março..." />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                  <div>
                    <div className="label">Valor *</div>
                    <input type="number" className="input" value={despesaForm.valor} onChange={e => setDespesaForm(f => ({ ...f, valor: e.target.value }))} placeholder="R$" min={0.01} step={0.01} />
                  </div>
                  <div>
                    <div className="label">Categoria</div>
                    <select className="input" value={despesaForm.categoria} onChange={e => setDespesaForm(f => ({ ...f, categoria: e.target.value }))}>
                      {CATEGORIAS_DESPESA.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn btn-primary" onClick={registrarDespesa} disabled={!despesaForm.descricao || !despesaForm.valor} style={{ flex: 1 }}>Confirmar</button>
                  <button className="btn btn-ghost" onClick={() => { setShowDespesaForm(false); setDespesaForm({ descricao: "", valor: "", categoria: "Operacional" }); }} style={{ flex: 1 }}>Cancelar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── CONTAS A PAGAR ── */}
      {subAba === "pagar" && <AbaPagar data={data} update={update} />}

      {/* ── CONTAS A RECEBER ── */}
      {subAba === "receber" && <AbaReceber data={data} update={update} />}

      {/* ── FLUXO DE CAIXA ── */}
      {subAba === "fluxo" && <AbaFluxo data={data} />}

      {/* ── RELATÓRIO FISCAL ── */}
      {subAba === "fiscal" && <AbaFiscal data={data} />}
    </div>
  );
}

// ── CONTAS A PAGAR ────────────────────────────────────────────────────────
function AbaPagar({ data, update }) {
  const [showForm, setShowForm] = useState(false);
  const [filtro, setFiltro] = useState("todas");
  const [form, setForm] = useState({ descricao: "", valor: "", vencimento: "", categoria: "Fornecedor", obs: "" });
  const CATS = ["Fornecedor","Aluguel","Energia","Água","Internet","Funcionário","Impostos","Outros"];
  const contas = data.contasPagar || [];
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const filtradas = contas.filter(c => {
    if (filtro === "pendentes") return !c.paga;
    if (filtro === "vencidas") return !c.paga && new Date(c.vencimento) < hoje;
    if (filtro === "pagas") return c.paga;
    return true;
  }).sort((a,b) => new Date(a.vencimento) - new Date(b.vencimento));
  const totalPendente = contas.filter(c => !c.paga).reduce((s,c) => s+c.valor, 0);
  const totalVencido  = contas.filter(c => !c.paga && new Date(c.vencimento) < hoje).reduce((s,c) => s+c.valor, 0);
  const salvar = () => {
    if (!form.descricao || !form.valor || !form.vencimento) return;
    update(d => {
      const id = (d.nextId.contaPagar || 1);
      return { ...d, contasPagar: [...(d.contasPagar||[]), { id, ...form, valor: Number(form.valor), paga: false, dataCriacao: new Date().toISOString() }], nextId: { ...d.nextId, contaPagar: id+1 } };
    });
    setForm({ descricao: "", valor: "", vencimento: "", categoria: "Fornecedor", obs: "" });
    setShowForm(false);
  };
  const pagar = (id) => {
    update(d => ({ ...d, contasPagar: (d.contasPagar||[]).map(c => c.id === id ? { ...c, paga: true, dataPagamento: new Date().toISOString() } : c) }));
  };
  const statusConta = (c) => {
    if (c.paga) return { label: "Paga", cor: "#22c97a" };
    const v = new Date(c.vencimento); v.setHours(0,0,0,0);
    const diff = Math.ceil((v - hoje) / 86400000);
    if (diff < 0) return { label: `Vencida há ${-diff}d`, cor: "#e05260" };
    if (diff === 0) return { label: "Vence hoje", cor: "#f0b429" };
    if (diff <= 7) return { label: `Em ${diff}d`, cor: "#f0b429" };
    return { label: `${diff} dias`, cor: "#6b7499" };
  };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div>
          <div style={{ fontSize: 13, color: "#6b7499" }}>Pendente / Vencido</div>
          <div style={{ fontSize: 20, fontWeight: 700 }}>
            <span style={{ color: "#e05260" }}>{fmt(totalPendente)}</span>
            {totalVencido > 0 && <span style={{ fontSize: 13, color: "#e05260", marginLeft: 8 }}>({fmt(totalVencido)} vencido)</span>}
          </div>
        </div>
        <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ Nova</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[["todas","Todas"],["pendentes","Pendentes"],["vencidas","Vencidas"],["pagas","Pagas"]].map(([k,l]) => (
          <button key={k} onClick={() => setFiltro(k)} style={{ padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", background: filtro===k?"#4f8ef7":"#1a1d27", color: filtro===k?"#fff":"#6b7499" }}>{l}</button>
        ))}
      </div>
      {filtradas.length === 0
        ? <div className="card" style={{ textAlign: "center", color: "#6b7499", padding: 40 }}>Nenhuma conta encontrada</div>
        : <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {filtradas.map(c => {
              const st = statusConta(c);
              return (
                <div key={c.id} style={{ background: "#161923", border: "1px solid #22263a", borderLeft: `4px solid ${st.cor}`, borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 2 }}>{c.descricao}</div>
                      <div style={{ fontSize: 11, color: "#6b7499" }}>{c.categoria} · Venc: {new Date(c.vencimento).toLocaleDateString("pt-BR")}</div>
                    </div>
                    <div style={{ textAlign: "right", marginLeft: 10 }}>
                      <div style={{ fontWeight: 700, fontSize: 16, color: c.paga?"#6b7499":"#e05260" }}>{fmt(c.valor)}</div>
                      <span style={{ fontSize: 11, fontWeight: 600, color: st.cor }}>{st.label}</span>
                    </div>
                  </div>
                  {!c.paga && (
                    <button className="btn btn-success" onClick={() => pagar(c.id)} style={{ width: "100%", marginTop: 10, fontSize: 12, padding: "7px 0" }}>✓ Marcar como Paga</button>
                  )}
                </div>
              );
            })}
          </div>
      }
      {showForm && (
        <div className="modal-overlay">
          <div className="modal" style={{ maxWidth: 420 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>📤 Nova Conta a Pagar</div>
            <div style={{ marginBottom: 12 }}>
              <div className="label">Descrição *</div>
              <input className="input" value={form.descricao} onChange={e => setForm(f=>({...f,descricao:e.target.value}))} placeholder="Ex: Fatura energia março..." />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
              <div><div className="label">Valor *</div><input type="number" className="input" value={form.valor} onChange={e => setForm(f=>({...f,valor:e.target.value}))} placeholder="R$" /></div>
              <div><div className="label">Vencimento *</div><input type="date" className="input" value={form.vencimento} onChange={e => setForm(f=>({...f,vencimento:e.target.value}))} /></div>
            </div>
            <div style={{ marginBottom: 14 }}>
              <div className="label">Categoria</div>
              <select className="input" value={form.categoria} onChange={e => setForm(f=>({...f,categoria:e.target.value}))}>
                {CATS.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-primary" onClick={salvar} disabled={!form.descricao||!form.valor||!form.vencimento} style={{ flex: 1 }}>Salvar</button>
              <button className="btn btn-ghost" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CONTAS A RECEBER ──────────────────────────────────────────────────────
function AbaReceber({ data, update }) {
  const [showForm, setShowForm] = useState(false);
  const [filtro, setFiltro] = useState("todas");
  const [form, setForm] = useState({ descricao: "", valor: "", vencimento: "", cliente: "", obs: "" });
  const contas = data.contasReceber || [];
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const filtradas = contas.filter(c => {
    if (filtro === "pendentes") return !c.recebida;
    if (filtro === "vencidas") return !c.recebida && new Date(c.vencimento) < hoje;
    if (filtro === "recebidas") return c.recebida;
    return true;
  }).sort((a,b) => new Date(a.vencimento) - new Date(b.vencimento));
  const totalPendente = contas.filter(c => !c.recebida).reduce((s,c) => s+c.valor, 0);
  const fiadoPendente = (data.clientes||[]).reduce((s,c) => s+c.saldo, 0);
  const salvar = () => {
    if (!form.descricao || !form.valor || !form.vencimento) return;
    update(d => {
      const id = (d.nextId.contaReceber || 1);
      return { ...d, contasReceber: [...(d.contasReceber||[]), { id, ...form, valor: Number(form.valor), recebida: false, dataCriacao: new Date().toISOString() }], nextId: { ...d.nextId, contaReceber: id+1 } };
    });
    setForm({ descricao: "", valor: "", vencimento: "", cliente: "", obs: "" });
    setShowForm(false);
  };
  const receber = (id) => {
    update(d => ({ ...d, contasReceber: (d.contasReceber||[]).map(c => c.id === id ? { ...c, recebida: true, dataRecebimento: new Date().toISOString() } : c) }));
  };
  const statusConta = (c) => {
    if (c.recebida) return { label: "Recebida", cor: "#22c97a" };
    const v = new Date(c.vencimento); v.setHours(0,0,0,0);
    const diff = Math.ceil((v - hoje) / 86400000);
    if (diff < 0) return { label: `Atrasada ${-diff}d`, cor: "#e05260" };
    if (diff === 0) return { label: "Vence hoje", cor: "#f0b429" };
    if (diff <= 7) return { label: `Em ${diff}d`, cor: "#f0b429" };
    return { label: `${diff} dias`, cor: "#6b7499" };
  };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div>
          <div style={{ fontSize: 13, color: "#6b7499" }}>Total a receber (contas + fiado)</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: "#22c97a" }}>{fmt(totalPendente + fiadoPendente)}</div>
          {fiadoPendente > 0 && <div style={{ fontSize: 11, color: "#6b7499" }}>inclui {fmt(fiadoPendente)} de fiado</div>}
        </div>
        <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ Nova</button>
      </div>
      {(data.clientes||[]).filter(c => c.saldo > 0).length > 0 && (
        <div style={{ background: "#11141e", borderRadius: 10, padding: 12, marginBottom: 14 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#f0b429", marginBottom: 8 }}>📋 FIADO PENDENTE</div>
          {(data.clientes||[]).filter(c => c.saldo > 0).map(c => (
            <div key={c.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
              <span style={{ color: "#a0a8c0" }}>{c.nome}</span>
              <span style={{ fontWeight: 700, color: "#f0b429" }}>{fmt(c.saldo)}</span>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[["todas","Todas"],["pendentes","Pendentes"],["vencidas","Vencidas"],["recebidas","Recebidas"]].map(([k,l]) => (
          <button key={k} onClick={() => setFiltro(k)} style={{ padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", background: filtro===k?"#4f8ef7":"#1a1d27", color: filtro===k?"#fff":"#6b7499" }}>{l}</button>
        ))}
      </div>
      {filtradas.length === 0
        ? <div className="card" style={{ textAlign: "center", color: "#6b7499", padding: 32 }}>Nenhuma conta cadastrada</div>
        : <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {filtradas.map(c => {
              const st = statusConta(c);
              return (
                <div key={c.id} style={{ background: "#161923", border: "1px solid #22263a", borderLeft: `4px solid ${st.cor}`, borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 2 }}>{c.descricao}</div>
                      <div style={{ fontSize: 11, color: "#6b7499" }}>{c.cliente && `${c.cliente} · `}Venc: {new Date(c.vencimento).toLocaleDateString("pt-BR")}</div>
                    </div>
                    <div style={{ textAlign: "right", marginLeft: 10 }}>
                      <div style={{ fontWeight: 700, fontSize: 16, color: c.recebida?"#6b7499":"#22c97a" }}>{fmt(c.valor)}</div>
                      <span style={{ fontSize: 11, fontWeight: 600, color: st.cor }}>{st.label}</span>
                    </div>
                  </div>
                  {!c.recebida && (
                    <button className="btn btn-success" onClick={() => receber(c.id)} style={{ width: "100%", marginTop: 10, fontSize: 12, padding: "7px 0" }}>✓ Marcar como Recebida</button>
                  )}
                </div>
              );
            })}
          </div>
      }
      {showForm && (
        <div className="modal-overlay">
          <div className="modal" style={{ maxWidth: 420 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>📥 Nova Conta a Receber</div>
            <div style={{ marginBottom: 12 }}>
              <div className="label">Descrição *</div>
              <input className="input" value={form.descricao} onChange={e => setForm(f=>({...f,descricao:e.target.value}))} placeholder="Ex: Pagamento parcelado cliente..." />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
              <div><div className="label">Valor *</div><input type="number" className="input" value={form.valor} onChange={e => setForm(f=>({...f,valor:e.target.value}))} placeholder="R$" /></div>
              <div><div className="label">Vencimento *</div><input type="date" className="input" value={form.vencimento} onChange={e => setForm(f=>({...f,vencimento:e.target.value}))} /></div>
            </div>
            <div style={{ marginBottom: 14 }}>
              <div className="label">Cliente (opcional)</div>
              <input className="input" value={form.cliente} onChange={e => setForm(f=>({...f,cliente:e.target.value}))} placeholder="Nome do cliente" />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-primary" onClick={salvar} disabled={!form.descricao||!form.valor||!form.vencimento} style={{ flex: 1 }}>Salvar</button>
              <button className="btn btn-ghost" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── FLUXO DE CAIXA ────────────────────────────────────────────────────────
function AbaFluxo({ data }) {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Array.from({ length: 30 }, (_, i) => { const d = new Date(hoje); d.setDate(d.getDate()+i); return d; });
  const contasPagar   = data.contasPagar   || [];
  const contasReceber = data.contasReceber || [];
  const vendas        = data.vendas        || [];
  const trintaDias = new Date(hoje); trintaDias.setDate(trintaDias.getDate()-30);
  const vendasRecentes = vendas.filter(v => !v.cancelada && new Date(v.data) >= trintaDias);
  const mediaDiaria = vendasRecentes.length > 0 ? vendasRecentes.reduce((s,v)=>s+v.total,0)/30 : 0;
  const saldoInicial = vendas.filter(v => !v.cancelada && new Date(v.data).toDateString()===hoje.toDateString() && v.pagamento==="dinheiro").reduce((s,v)=>s+v.total,0);
  let saldoAcum = saldoInicial;
  const linhas = dias.map(d => {
    const ds = d.toISOString().slice(0,10);
    const entradas = contasReceber.filter(c => !c.recebida && c.vencimento===ds).reduce((s,c)=>s+c.valor,0) + mediaDiaria;
    const saidas   = contasPagar.filter(c => !c.paga && c.vencimento===ds).reduce((s,c)=>s+c.valor,0);
    saldoAcum += entradas - saidas;
    return { d, ds, entradas, saidas, saldo: saldoAcum };
  });
  const maxSaldo = Math.max(...linhas.map(l=>Math.abs(l.saldo)), 1);
  return (
    <div>
      <div style={{ fontSize: 12, color: "#6b7499", marginBottom: 14, lineHeight: 1.6 }}>
        Projeção 30 dias — contas cadastradas + média de vendas ({fmt(mediaDiaria)}/dia).
      </div>
      <div style={{ background: "#11141e", borderRadius: 12, padding: 14, marginBottom: 16, overflowX: "auto" }}>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 80, minWidth: 500 }}>
          {linhas.map((l,i) => {
            const h = Math.max(4, Math.abs(l.saldo)/maxSaldo*72);
            return <div key={i} title={`${l.ds}: ${fmt(l.saldo)}`} style={{ flex:1, height:h, background: l.saldo>=0?"#22c97a":"#e05260", borderRadius:"2px 2px 0 0", opacity:.8, minWidth:10 }} />;
          })}
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4, fontSize:10, color:"#6b7499" }}>
          <span>Hoje</span><span>+15 dias</span><span>+30 dias</span>
        </div>
      </div>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7499", marginBottom: 10, letterSpacing: .5 }}>PRÓXIMOS VENCIMENTOS</div>
      <div className="card" style={{ padding: 0, overflow: "hidden" }}>
        <table className="table">
          <thead><tr><th>Data</th><th>Evento</th><th>Entrada</th><th>Saída</th><th>Saldo</th></tr></thead>
          <tbody>
            {linhas.filter(l => l.entradas > mediaDiaria+0.01 || l.saidas > 0).slice(0,15).map((l,i) => (
              <tr key={i}>
                <td style={{ fontSize:11, color:"#6b7499", whiteSpace:"nowrap" }}>{l.d.toLocaleDateString("pt-BR")}</td>
                <td style={{ fontSize:11 }}>
                  {[...contasPagar.filter(c=>!c.paga&&c.vencimento===l.ds).map(c=>c.descricao), ...contasReceber.filter(c=>!c.recebida&&c.vencimento===l.ds).map(c=>c.descricao)].join(", ")||"-"}
                </td>
                <td style={{ color:"#22c97a", fontSize:12 }}>{l.entradas>mediaDiaria+0.01?fmt(l.entradas-mediaDiaria):"-"}</td>
                <td style={{ color:"#e05260", fontSize:12 }}>{l.saidas>0?fmt(l.saidas):"-"}</td>
                <td style={{ fontWeight:700, color:l.saldo>=0?"#22c97a":"#e05260" }}>{fmt(l.saldo)}</td>
              </tr>
            ))}
            {linhas.filter(l=>l.entradas>mediaDiaria+0.01||l.saidas>0).length===0 && (
              <tr><td colSpan={5} style={{ textAlign:"center", color:"#6b7499", padding:24 }}>Nenhum vencimento cadastrado</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── RELATÓRIO FISCAL ──────────────────────────────────────────────────────
function AbaFiscal({ data }) {
  const [mes, setMes] = useState(() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; });
  const partes = mes.split("-");
  const anoN = Number(partes[0]);
  const mesN = Number(partes[1]);
  const isMesSel = (d) => { const dt=new Date(d); return dt.getMonth()+1===mesN && dt.getFullYear()===anoN; };
  const vendas   = (data.vendas||[]).filter(v=>!v.cancelada&&isMesSel(v.data));
  const compras  = (data.compras||[]).filter(c=>!c.cancelada&&isMesSel(c.data));
  const despesas = (data.despesas||[]).filter(d=>isMesSel(d.data));
  const perdas   = (data.perdas||[]).filter(p=>isMesSel(p.data));
  const receitaBruta    = vendas.reduce((s,v)=>s+v.total,0);
  const taxasPagas      = vendas.reduce((s,v)=>s+(v.taxaValor||0),0);
  const receitaLiquida  = vendas.reduce((s,v)=>s+(v.liquido||v.total),0);
  const custoMercadorias = vendas.reduce((s,v)=>s+(v.itens||[]).reduce((si,i)=>{ const p=(data.produtos||[]).find(p=>p.id===i.id); return si+(p?p.custo*i.qty:0); },0),0);
  const totalDespesas   = despesas.reduce((s,d)=>s+d.valor,0);
  const totalPerdas     = perdas.reduce((s,p)=>s+p.qty*p.custo,0);
  const totalCompras    = compras.reduce((s,c)=>s+c.total,0);
  const lucroBruto      = receitaLiquida - custoMercadorias;
  const lucroLiquido    = lucroBruto - totalDespesas - totalPerdas;
  const porPagamento = ["dinheiro","pix","credito","debito","fiado"].map(f=>({ forma:f, qtd:vendas.filter(v=>v.pagamento===f).length, total:vendas.filter(v=>v.pagamento===f).reduce((s,v)=>s+v.total,0) })).filter(x=>x.qtd>0);
  const exportarTxt = () => {
    const nomes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const txt = `RELATÓRIO FISCAL — ${nomes[mesN-1]}/${anoN}
${"=".repeat(40)}

RECEITAS
Receita bruta:        ${fmt(receitaBruta)}
Taxas de pagamento:  -${fmt(taxasPagas)}
Receita líquida:      ${fmt(receitaLiquida)}

CUSTOS E DESPESAS
Custo mercadorias:   -${fmt(custoMercadorias)}
Despesas fixas:      -${fmt(totalDespesas)}
Perdas:              -${fmt(totalPerdas)}

RESULTADO
Lucro bruto:          ${fmt(lucroBruto)}
Lucro líquido:        ${fmt(lucroLiquido)}

COMPRAS DO PERÍODO
Total comprado:       ${fmt(totalCompras)}

VENDAS POR PAGAMENTO
${porPagamento.map(x=>`${x.forma.padEnd(10)} ${x.qtd} vendas   ${fmt(x.total)}`).join("\n")}

Ticket médio: ${fmt(vendas.length>0?receitaBruta/vendas.length:0)}
Gerado: ${new Date().toLocaleString("pt-BR")}`;
    try {
      const blob = new Blob([txt],{type:"text/plain;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=`relatorio-${mes}.txt`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    } catch (_) { navigator.clipboard?.writeText(txt); }
  };
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div>
          <div className="label">Período</div>
          <input type="month" className="input" value={mes} onChange={e=>setMes(e.target.value)} style={{ width:"auto" }} />
        </div>
        <button className="btn btn-primary" onClick={exportarTxt} style={{ fontSize:12 }}>⬇️ Exportar .txt</button>
      </div>
      <div style={{ fontSize:12, fontWeight:700, color:"#6b7499", marginBottom:10, letterSpacing:.5 }}>DEMONSTRATIVO DE RESULTADO (DRE)</div>
      <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:18 }}>
        {[
          {label:"Receita bruta",valor:receitaBruta,cor:"#4f8ef7",bold:false},
          {label:"(-) Taxas de pagamento",valor:-taxasPagas,cor:"#e05260",bold:false},
          {label:"Receita líquida",valor:receitaLiquida,cor:"#4f8ef7",bold:true},
          {label:"(-) Custo das mercadorias",valor:-custoMercadorias,cor:"#e05260",bold:false},
          {label:"Lucro bruto",valor:lucroBruto,cor:lucroBruto>=0?"#22c97a":"#e05260",bold:true},
          {label:"(-) Despesas fixas",valor:-totalDespesas,cor:"#e05260",bold:false},
          {label:"(-) Perdas",valor:-totalPerdas,cor:"#f0b429",bold:false},
          {label:"Lucro líquido",valor:lucroLiquido,cor:lucroLiquido>=0?"#22c97a":"#e05260",bold:true},
        ].map(({label,valor,cor,bold})=>(
          <div key={label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:bold?"12px 14px":"8px 14px", background:bold?"#11141e":"#161923", borderRadius:8, border:bold?`1px solid ${cor}44`:"none" }}>
            <span style={{ fontSize:bold?14:13, fontWeight:bold?700:400, color:bold?"#e8eaf0":"#a0a8c0" }}>{label}</span>
            <span style={{ fontSize:bold?16:13, fontWeight:700, color:cor }}>{valor<0?"- ":""}{fmt(Math.abs(valor))}</span>
          </div>
        ))}
      </div>
      <div style={{ fontSize:12, fontWeight:700, color:"#6b7499", marginBottom:10, letterSpacing:.5 }}>VENDAS POR FORMA DE PAGAMENTO</div>
      <div className="card" style={{ padding:0, overflow:"hidden", marginBottom:16 }}>
        <table className="table">
          <thead><tr><th>Forma</th><th>Qtd</th><th>Total</th><th>%</th></tr></thead>
          <tbody>
            {porPagamento.length===0
              ? <tr><td colSpan={4} style={{textAlign:"center",color:"#6b7499",padding:20}}>Sem vendas no período</td></tr>
              : porPagamento.map(x=>(
                <tr key={x.forma}>
                  <td style={{ fontWeight:600, textTransform:"capitalize" }}>{x.forma}</td>
                  <td style={{ color:"#6b7499" }}>{x.qtd}</td>
                  <td style={{ fontWeight:700, color:"#4f8ef7" }}>{fmt(x.total)}</td>
                  <td style={{ color:"#6b7499" }}>{receitaBruta>0?(x.total/receitaBruta*100).toFixed(1):0}%</td>
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>
      <div style={{ background:"#11141e", borderRadius:10, padding:14, fontSize:13 }}>
        {[["Total comprado no período",fmt(totalCompras),"#a78bfa"],["Nº de vendas",String(vendas.length),"#e8eaf0"],["Ticket médio",fmt(vendas.length>0?receitaBruta/vendas.length:0),"#e8eaf0"]].map(([l,v,c])=>(
          <div key={l} style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
            <span style={{ color:"#6b7499" }}>{l}</span><span style={{ fontWeight:700, color:c }}>{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function AbaContagem({ data, update }) {
  const [busca, setBusca] = useState("");
  const [catFiltro, setCatFiltro] = useState("Todos");
  const [mostrar, setMostrar] = useState("movimento"); // "movimento" | "todos"
  const [contagens, setContagens] = useState({});
  const [confirmando, setConfirmando] = useState(false);

  const hoje = new Date().toDateString();
  const vendasHoje = (data.vendas || []).filter(v =>
    !v.cancelada && new Date(v.data).toDateString() === hoje
  );
  const idsComMovimento = new Set();
  vendasHoje.forEach(v => (v.itens || []).forEach(i => idsComMovimento.add(i.id)));

  const categorias = ["Todos", ...new Set((data.produtos || []).map(p => (p.categoria || "").trim()).filter(Boolean).sort())];

  const produtosFiltrados = (data.produtos || []).filter(p => {
    if (mostrar === "movimento" && !idsComMovimento.has(p.id)) return false;
    if (catFiltro !== "Todos" && (p.categoria || "").trim() !== catFiltro) return false;
    if (busca.trim()) {
      const b = busca.toLowerCase();
      return p.nome.toLowerCase().includes(b) || (p.barcode || "").includes(b) || (p.codigo || "").includes(b);
    }
    return true;
  }).sort((a, b) => a.nome.localeCompare(b.nome));

  const setContagem = (id, val) => {
    setContagens(prev => ({ ...prev, [id]: val }));
  };

  const diferencas = produtosFiltrados
    .filter(p => contagens[p.id] !== undefined && contagens[p.id] !== "")
    .map(p => {
      const contado = Number(contagens[p.id]);
      const diff = contado - p.estoque;
      return { ...p, contado, diff };
    })
    .filter(p => p.diff !== 0);

  const aplicarContagem = () => {
    if (diferencas.length === 0) return;
    update(d => {
      let novosProdutos = d.produtos.map(p => {
        const item = diferencas.find(x => x.id === p.id);
        if (!item) return p;
        return { ...p, estoque: item.contado };
      });
      // Registrar diferenças negativas como perdas
      let novasPerdas = [...(d.perdas || [])];
      let nextPerda = d.nextId.perda || 1;
      diferencas.filter(x => x.diff < 0).forEach(x => {
        novasPerdas.push({
          id: nextPerda++,
          produtoId: x.id,
          nome: x.nome,
          qty: Math.abs(x.diff),
          custo: x.custo || 0,
          motivo: "Contagem de estoque",
          obs: `Contagem: ${x.contado} | Sistema: ${x.estoque}`,
          data: new Date().toISOString(),
        });
      });
      return { ...d, produtos: novosProdutos, perdas: novasPerdas, nextId: { ...d.nextId, perda: nextPerda } };
    });
    setContagens({});
    setConfirmando(false);
  };

  return (
    <div>
      <div className="section-title">🔢 Contagem de Estoque</div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <input
          className="input"
          placeholder="🔍 Buscar produto..."
          value={busca}
          onChange={e => setBusca(e.target.value)}
          style={{ flex: 1, minWidth: 150 }}
        />
        <select className="input" value={catFiltro} onChange={e => setCatFiltro(e.target.value)} style={{ width: "auto" }}>
          {categorias.map(c => <option key={c}>{c}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["movimento", `Com movimento hoje (${idsComMovimento.size})`], ["todos", "Todos os produtos"]].map(([k, l]) => (
          <button key={k} onClick={() => setMostrar(k)} style={{
            padding: "7px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600,
            border: "none", cursor: "pointer",
            background: mostrar === k ? "#4f8ef7" : "#1a1d27",
            color: mostrar === k ? "#fff" : "#6b7499"
          }}>{l}</button>
        ))}
      </div>

      {/* Lista de produtos */}
      {produtosFiltrados.length === 0 ? (
        <div className="card" style={{ textAlign: "center", color: "#6b7499", padding: 40 }}>
          {mostrar === "movimento" ? "Nenhum produto com movimento hoje." : "Nenhum produto encontrado."}
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
          {produtosFiltrados.map(p => {
            const val = contagens[p.id];
            const contado = val !== undefined && val !== "" ? Number(val) : null;
            const diff = contado !== null ? contado - p.estoque : null;
            const corDiff = diff === null ? "transparent" : diff > 0 ? "#22c97a22" : diff < 0 ? "#e0526022" : "#22263a";
            return (
              <div key={p.id} style={{
                display: "flex", alignItems: "center", gap: 10,
                background: diff !== null && diff !== 0 ? corDiff : "#161923",
                border: `1px solid ${diff !== null && diff !== 0 ? (diff > 0 ? "#22c97a55" : "#e0526055") : "#22263a"}`,
                borderRadius: 10, padding: "10px 12px"
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#e8eaf0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.nome}</div>
                  <div style={{ fontSize: 11, color: "#6b7499" }}>Sistema: <strong style={{ color: "#a0a8c0" }}>{p.estoque}</strong></div>
                </div>
                <input
                  type="number"
                  className="input"
                  placeholder="contar"
                  value={val !== undefined ? val : ""}
                  onChange={e => setContagem(p.id, e.target.value)}
                  onFocus={e => { const t = e.target; setTimeout(() => t.select(), 0); }}
                  min={0}
                  style={{ width: 70, textAlign: "center", padding: "6px 4px" }}
                />
                {diff !== null && (
                  <div style={{ width: 48, textAlign: "right", fontWeight: 700, fontSize: 13, color: diff > 0 ? "#22c97a" : diff < 0 ? "#e05260" : "#6b7499" }}>
                    {diff > 0 ? `+${diff}` : diff}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Resumo e confirmar */}
      {diferencas.length > 0 && (
        <div style={{ background: "#11141e", border: "1px solid #22263a", borderRadius: 12, padding: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: "#e8eaf0" }}>
            📋 Resumo — {diferencas.length} diferença{diferencas.length !== 1 ? "s" : ""}
          </div>
          {diferencas.map(p => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4, color: "#a0a8c0" }}>
              <span style={{ flex: 1 }}>{p.nome}</span>
              <span style={{ color: "#6b7499", marginRight: 8 }}>{p.estoque} → {p.contado}</span>
              <span style={{ fontWeight: 700, color: p.diff > 0 ? "#22c97a" : "#e05260", width: 36, textAlign: "right" }}>{p.diff > 0 ? `+${p.diff}` : p.diff}</span>
            </div>
          ))}
          <div style={{ fontSize: 11, color: "#6b7499", marginTop: 10 }}>
            Diferenças negativas serão registradas como perdas automaticamente.
          </div>
          <button className="btn btn-primary" onClick={() => setConfirmando(true)} style={{ width: "100%", marginTop: 12 }}>
            Aplicar Contagem
          </button>
        </div>
      )}

      {confirmando && (
        <div className="modal-overlay">
          <div className="modal" style={{ maxWidth: 380 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>⚠️ Confirmar contagem?</div>
            <div style={{ fontSize: 13, color: "#a0a8c0", marginBottom: 16 }}>
              O estoque de {diferencas.length} produto{diferencas.length !== 1 ? "s" : ""} será atualizado.
              {diferencas.filter(x => x.diff < 0).length > 0 && (
                <span> {diferencas.filter(x => x.diff < 0).length} perda{diferencas.filter(x => x.diff < 0).length !== 1 ? "s" : ""} serão registradas.</span>
              )}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-primary" onClick={aplicarContagem} style={{ flex: 1 }}>Confirmar</button>
              <button className="btn btn-ghost" onClick={() => setConfirmando(false)} style={{ flex: 1 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

            <div key={f.key} className="card">
              <div style={{ fontSize: 24, marginBottom: 10 }}>{f.icon}</div>

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(e) { return { erro: e }; }
  componentDidCatch(e, info) { console.error(e, info); }
  render() {
    if (this.state.erro) return (<div style={{padding:20,color:"#e05260",background:"#1a0808",minHeight:"100vh",whiteSpace:"pre-wrap",wordBreak:"break-all",fontSize:13}}>{"ERRO REACT:\n"+this.state.erro.message+"\n"+(this.state.erro.stack||"")}</div>);
    return this.props.children;
  }
}

        new Function(result.code)();
      } catch(runErr) {
        mostrarErroCompilacao('ERRO DE EXECUÇÃO', runErr.message + '\n\n' + (runErr.stack||''));
      }
    } catch(e) {
      mostrarErroCompilacao('ERRO INESPERADO', e.message + '\n\n' + (e.stack||''));
    }
  })();
  </script>

          .catch(function(err) { console.warn('[PDV] SW erro:', err); });
