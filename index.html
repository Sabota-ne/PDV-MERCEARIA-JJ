  <script>/**
 * PDV Pro — firebase.js
 * Firebase v9 compat via CDN
 */

var firebaseConfig = {
  apiKey:            "AIzaSyBxkvDK1sUvLBxStklq5Xig_aOh3BcE3jo",
  authDomain:        "meu-pdv-jj.firebaseapp.com",
  projectId:         "meu-pdv-jj",
  storageBucket:     "meu-pdv-jj.firebasestorage.app",
  messagingSenderId: "773429049941",
  appId:             "1:773429049941:web:a171b02cd0cfa2cc4272dc"
};

var CONFIGURADO = (
  firebaseConfig.apiKey    !== "SUA_API_KEY_AQUI" &&
  firebaseConfig.apiKey    !== ""                  &&
  firebaseConfig.projectId !== "seu-projeto"       &&
  firebaseConfig.projectId !== ""
);

if (!CONFIGURADO) {
  console.info("[PDV] firebase.js: não configurado → modo local.");
  window.FirebaseDB = {
    estaConfigurado  : function() { return false; },
    carregar         : async function() { return null; },
    ouvir            : function() { return function() {}; },
    adicionarVenda   : async function() {},
    adicionarCompra  : async function() {},
    adicionarFiado   : async function() {},
    quitarFiado      : async function() {},
    adicionarPerda   : async function() {},
    adicionarSangria : async function() {},
    adicionarDespesa : async function() {},
    salvarCaixa      : async function() {},
    salvarContaPagar : async function() {},
    salvarContaReceber: async function() {},
    salvarConfig     : async function() {},
    migrarDeBackup   : async function() {},
  };
} else {
  try {
    firebase.initializeApp(firebaseConfig);
  } catch (e) {
    if (e.code !== "app/duplicate-app") console.error("[PDV] Firebase init:", e);
  }

  var db = firebase.firestore();

  var DOC_CONFIG       = db.collection("pdv").doc("config");
  var COL_VENDAS       = "pdv_vendas";
  var COL_COMPRAS      = "pdv_compras";
  var COL_FIADO        = "pdv_fiado";
  var COL_PERDAS       = "pdv_perdas";
  var COL_SANGRIAS     = "pdv_sangrias";
  var COL_DESPESAS     = "pdv_despesas";
  var COL_CAIXAS       = "pdv_caixas";
  var COL_CONTAS_PAGAR   = "pdv_contas_pagar";
  var COL_CONTAS_RECEBER = "pdv_contas_receber";

  function clean(obj) { return JSON.parse(JSON.stringify(obj)); }
  function docRef(col, id) { return db.collection(col).doc(String(id)); }

  async function carregar() {
    try {
      var snaps = await Promise.all([
        DOC_CONFIG.get(),
        db.collection(COL_VENDAS).where("data", ">", (function(){ var d=new Date(); d.setDate(d.getDate()-90); return d.toISOString(); })()).orderBy("data").get(),
        db.collection(COL_COMPRAS).orderBy("data").get(),
        db.collection(COL_FIADO).get(),
        db.collection(COL_PERDAS).where("data", ">", (function(){ var d=new Date(); d.setDate(d.getDate()-60); return d.toISOString(); })()).orderBy("data").get(),
        db.collection(COL_SANGRIAS).where("data", ">", (function(){ var d=new Date(); d.setDate(d.getDate()-60); return d.toISOString(); })()).orderBy("data").get(),
        db.collection(COL_DESPESAS).where("data", ">", (function(){ var d=new Date(); d.setDate(d.getDate()-60); return d.toISOString(); })()).orderBy("data").get(),
        db.collection(COL_CAIXAS).get(),
        db.collection(COL_CONTAS_PAGAR).get(),
        db.collection(COL_CONTAS_RECEBER).get(),
      ]);

      var cfg = snaps[0].exists ? snaps[0].data() : {};
      return {
        produtos       : cfg.produtos    || [],
        clientes       : cfg.clientes    || [],
        fornecedores   : cfg.fornecedores || [],
        taxas          : cfg.taxas       || null,
        nextId         : cfg.nextId      || null,
        vendas         : snaps[1].docs.map(function(d) { return d.data(); }),
        compras        : snaps[2].docs.map(function(d) { return d.data(); }),
        fiado          : snaps[3].docs.map(function(d) { return d.data(); }),
        perdas         : snaps[4].docs.map(function(d) { return d.data(); }),
        sangrias       : snaps[5].docs.map(function(d) { return d.data(); }),
        despesas       : snaps[6].docs.map(function(d) { return d.data(); }),
        caixas         : snaps[7].docs.map(function(d) { return d.data(); }),
        contasPagar    : snaps[8].docs.map(function(d) { return d.data(); }),
        contasReceber  : snaps[9].docs.map(function(d) { return d.data(); }),
      };
    } catch (err) {
      console.error("[PDV] Erro ao carregar Firestore:", err);
      throw err;
    }
  }

  function ouvir(callback) {
    return DOC_CONFIG.onSnapshot(
      function(snap) { if (snap.exists) callback(snap.data()); },
      function(err)  { console.warn("[PDV] onSnapshot:", err.code, err.message); }
    );
  }

  function salvarConfig(data) {
    return DOC_CONFIG.set(clean({
      produtos     : data.produtos     || [],
      clientes     : data.clientes     || [],
      fornecedores : data.fornecedores || [],
      taxas        : data.taxas        || {},
      nextId       : data.nextId       || {},
    })).catch(function(e) { console.error("[PDV] salvarConfig:", e); });
  }

  function adicionarVenda(v) {
    var obj = clean(v);
    obj.serverTs = firebase.firestore.FieldValue.serverTimestamp();
    return docRef(COL_VENDAS, v.id).set(obj, { merge: true }).catch(function(e) { console.error("[PDV] adicionarVenda:", e); });
  }
  function adicionarCompra(c)   { return docRef(COL_COMPRAS,  c.id).set(clean(c), { merge: true }).catch(function(e) { console.error("[PDV] adicionarCompra:", e); }); }
  function adicionarFiado(f)    { return docRef(COL_FIADO,    f.id).set(clean(f), { merge: true }).catch(function(e) { console.error("[PDV] adicionarFiado:", e); }); }
  function adicionarPerda(p)    { return docRef(COL_PERDAS,   p.id).set(clean(p), { merge: true }).catch(function(e) { console.error("[PDV] adicionarPerda:", e); }); }
  function adicionarSangria(s)  { return docRef(COL_SANGRIAS, s.id).set(clean(s), { merge: true }).catch(function(e) { console.error("[PDV] adicionarSangria:", e); }); }
  function adicionarDespesa(d)  { return docRef(COL_DESPESAS, d.id).set(clean(d), { merge: true }).catch(function(e) { console.error("[PDV] adicionarDespesa:", e); }); }

  function salvarCaixa(c) {
    return docRef(COL_CAIXAS, c.id).set(clean(c), { merge: true }).catch(function(e) { console.error("[PDV] salvarCaixa:", e); });
  }
  function salvarContaPagar(c) {
    return docRef(COL_CONTAS_PAGAR, c.id).set(clean(c), { merge: true }).catch(function(e) { console.error("[PDV] salvarContaPagar:", e); });
  }
  function salvarContaReceber(c) {
    return docRef(COL_CONTAS_RECEBER, c.id).set(clean(c), { merge: true }).catch(function(e) { console.error("[PDV] salvarContaReceber:", e); });
  }

  function quitarFiado(clienteId, todosOsFiados) {
    (todosOsFiados || []).filter(function(f) { return f.clienteId === clienteId; })
      .forEach(function(f) { docRef(COL_FIADO, f.id).set(clean(f), { merge: true }).catch(function(e) { console.error("[PDV] quitarFiado:", e); }); });
  }

  async function migrarDeBackup(data) {
    console.info("[PDV] Iniciando migração de backup...");
    try {
      var ops = [];
      ops.push(DOC_CONFIG.set(clean({ produtos: data.produtos||[], clientes: data.clientes||[], fornecedores: data.fornecedores||[], taxas: data.taxas||{}, nextId: data.nextId||{} })));
      var cols = [
        [COL_VENDAS,         data.vendas         || []],
        [COL_COMPRAS,        data.compras        || []],
        [COL_FIADO,          data.fiado          || []],
        [COL_PERDAS,         data.perdas         || []],
        [COL_SANGRIAS,       data.sangrias       || []],
        [COL_DESPESAS,       data.despesas       || []],
        [COL_CAIXAS,         data.caixas         || []],
        [COL_CONTAS_PAGAR,   data.contasPagar    || []],
        [COL_CONTAS_RECEBER, data.contasReceber  || []],
      ];
      cols.forEach(function(pair) {
        pair[1].forEach(function(item) { ops.push(docRef(pair[0], item.id).set(clean(item))); });
      });
      for (var i = 0; i < ops.length; i += 100) {
        await Promise.all(ops.slice(i, i + 100));
      }
      console.info("[PDV] Migração concluída — " + ops.length + " documentos.");
    } catch (err) {
      console.error("[PDV] Erro na migração:", err);
    }
  }

  window.FirebaseDB = {
    estaConfigurado    : function() { return true; },
    carregar           : carregar,
    ouvir              : ouvir,
    adicionarVenda     : adicionarVenda,
    adicionarCompra    : adicionarCompra,
    adicionarFiado     : adicionarFiado,
    quitarFiado        : quitarFiado,
    adicionarPerda     : adicionarPerda,
    adicionarSangria   : adicionarSangria,
    adicionarDespesa   : adicionarDespesa,
    salvarCaixa        : salvarCaixa,
    salvarContaPagar   : salvarContaPagar,
    salvarContaReceber : salvarContaReceber,
    salvarConfig       : salvarConfig,
    migrarDeBackup     : migrarDeBackup,
  };

  console.info("[PDV] Firebase pronto →", firebaseConfig.projectId);
}

  <script>
    function mostrarErro(titulo, msg, stack) {
      var root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="padding:24px;color:#e05260;background:#1a0808;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all"><b style="font-size:15px">' + titulo + '</b>\n\n' + msg + (stack ? '\n\n' + stack : '') + '</div>';
      }
    }
    window.addEventListener('error', function(e) {
      var detail = e.message || String(e);
      if (detail === 'Script error.' || detail === 'Script error') {
        detail = 'Script error (cross-origin) — verifique o console do navegador (F12) para detalhes.\n\nPossível causa: falha no Babel ao transpilar o JSX, ou erro em script CDN.';
      }
      var stack = (e.error && e.error.stack) ? e.error.stack : '';
      var loc = e.filename ? ('\nArquivo: ' + e.filename + ' linha ' + e.lineno + ':' + e.colno) : '';
      mostrarErro('ERRO GLOBAL' + loc, detail, stack);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
      var stack = (e.reason && e.reason.stack) ? e.reason.stack : '';
      mostrarErro('PROMISE REJEITADA', msg, stack);
    });
  </script>

// ── Cookie helpers (backup secundário) ──────────────────────────
const COOKIE_KEY = "pdv_session_v1";

function saveCookie(data) {
  try {
    const json = JSON.stringify(data);
    // Cookies têm limite de 4KB — divide em chunks de 3KB
    const chunks = [];
    for (let i = 0; i < json.length; i += 3000) chunks.push(json.slice(i, i + 3000));
    // Limpa cookies antigos
    for (let i = 0; i < 20; i++) document.cookie = `${COOKIE_KEY}_${i}=;max-age=0;path=/`;
    // Salva novos chunks
    chunks.forEach((chunk, i) => {
      document.cookie = `${COOKIE_KEY}_${i}=${encodeURIComponent(chunk)};max-age=2592000;path=/`; // 30 dias
    });
    document.cookie = `${COOKIE_KEY}_total=${chunks.length};max-age=2592000;path=/`;
  } catch (_) {}
}

function loadCookie() {
  try {
    const cookies = Object.fromEntries(document.cookie.split(";").map(c => c.trim().split("=").map(decodeURIComponent)));
    const total = parseInt(cookies[`${COOKIE_KEY}_total`] || "0");
    if (!total) return null;
    let json = "";
    for (let i = 0; i < total; i++) json += cookies[`${COOKIE_KEY}_${i}`] || "";
    return json ? JSON.parse(json) : null;
  } catch (_) { return null; }
}

function loadData() {
  const DEFAULT_TAXAS = { pix: 0, credito: 3.5, debito: 1.5 };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.taxas) parsed.taxas = DEFAULT_TAXAS;
      if ((parsed.produtos || []).length >= (USER_BACKUP.produtos || []).length) {
        return { ...defaultData, ...parsed };

    }

    if (fromCookie && (fromCookie.produtos || []).length >= (USER_BACKUP.produtos || []).length) {
      if (!fromCookie.taxas) fromCookie.taxas = DEFAULT_TAXAS;
      saveData({ ...defaultData, ...fromCookie });
      return { ...defaultData, ...fromCookie };
    }
  } catch (_) {}
  const initial = { ...defaultData, ...USER_BACKUP };
  if (!initial.taxas) initial.taxas = DEFAULT_TAXAS;
  saveData(initial);
  return initial;
}

function saveData(data) {

}

// ── Barcode lookup — 3 camadas: banco local → Open Food Facts → Cosmos ──
// Todas as APIs são gratuitas e não precisam de chave.
// Funciona tanto aqui no chat quanto hospedado no Netlify/tiiny.host.


// Cache de barcodes já buscados nesta sessão (evita buscas repetidas)
const barcodeCache = {};

async function buscarPorBarcode(codigo) {
  if (barcodeCache[codigo] !== undefined) return barcodeCache[codigo];
  const local = PRODUTOS_BR[codigo];
  if (local) { barcodeCache[codigo] = { ...local, imagem: "", fonte: "Base Local ⚡" }; return barcodeCache[codigo]; }
  try {
    const resp = await fetch(`https://world.openfoodfacts.org/api/v0/product/${codigo}.json`, { headers: { "User-Agent": "PDV-Pro/1.0" } });
    if (!resp.ok) { barcodeCache[codigo] = null; return null; }
    const d = await resp.json();
    if (d.status === 1 && d.product) {
      const p = d.product;
      const nome = p.product_name_pt || p.product_name || "";
      if (!nome) { barcodeCache[codigo] = null; return null; }
      const catRaw = (p.categories || "").toLowerCase();
      let categoria = "Mercearia";
      if (/bebida|drink|refrigerante|suco|cerveja|energético/.test(catRaw)) categoria = "Bebidas";
      else if (/biscoito|bolacha|cookie|wafer/.test(catRaw)) categoria = "Biscoitos";
      else if (/chocolate|bombom|doce/.test(catRaw)) categoria = "Doces";
      else if (/leite|iogurte|queijo|laticínio/.test(catRaw)) categoria = "Laticínios";
      else if (/limpeza|detergente|sabão/.test(catRaw)) categoria = "Limpeza";
      else if (/higiene|shampoo|sabonete/.test(catRaw)) categoria = "Higiene";
      else if (/salgadinho|snack|chips/.test(catRaw)) categoria = "Salgadinhos";
      const resultado = { nome: nome.trim(), categoria, imagem: p.image_front_small_url || "", fonte: "Open Food Facts 🌐" };
      barcodeCache[codigo] = resultado; return resultado;
    }
    barcodeCache[codigo] = null; return null;
  } catch (e) { return { erro: "Sem conexão.", encontrado: false }; }
}

const fmt = (v) =>

function calcLiquido(valor, forma, taxas) {
  const t = (taxas || {})[forma] ?? 0;
  return Math.round(valor * (1 - t / 100) * 100) / 100;
}

function today() {
  return new Date().toISOString().split("T")[0];
}

function filterByPeriod(vendas, periodo, dataInicio, dataFim) {
  const now = new Date();
  return vendas.filter((v) => {
    const d = new Date(v.data);
    if (periodo === "dia") return d.toDateString() === now.toDateString();
    if (periodo === "semana") { const diff = (now - d) / 86400000; return diff >= 0 && diff < 7; }
    if (periodo === "mes") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (periodo === "ano") return d.getFullYear() === now.getFullYear();
    if (periodo === "custom" && dataInicio && dataFim) {
      const ini = new Date(dataInicio); ini.setHours(0,0,0,0);
      const fim = new Date(dataFim); fim.setHours(23,59,59,999);
      return d >= ini && d <= fim;
    }
    return true;
  });
}

// CAMERA SCANNER — usa Html5Qrcode para leitura precisa de barcodes
// ══════════════════════════════════════════════════════════════════
function CameraScanner({ onDetected, onClose }) {
  const containerRef = React.useRef(null);
  const scannerRef = React.useRef(null);
  const [status, setStatus] = useState("iniciando");
  const [erroMsg, setErroMsg] = useState("");
  const [flashLine, setFlashLine] = useState(false);

  useEffect(() => {
    let active = true;
    const divId = "html5qr-scanner-" + Math.random().toString(36).slice(2);

    const iniciar = async () => {
      if (!window.Html5Qrcode) {
        setErroMsg("Biblioteca de leitura não carregou. Verifique sua conexão e tente novamente.");
        setStatus("erro");
        return;
      }

      // Cria div container para o scanner
      const div = document.createElement("div");
      div.id = divId;
      div.style.display = "none";
      document.body.appendChild(div);

      try {
        const scanner = new window.Html5Qrcode(divId);
        scannerRef.current = scanner;

        await scanner.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 250, height: 120 }, aspectRatio: 1.5,
            formatsToSupport: [
              window.Html5QrcodeSupportedFormats?.EAN_13,
              window.Html5QrcodeSupportedFormats?.EAN_8,
              window.Html5QrcodeSupportedFormats?.CODE_128,
              window.Html5QrcodeSupportedFormats?.CODE_39,
              window.Html5QrcodeSupportedFormats?.UPC_A,
              window.Html5QrcodeSupportedFormats?.UPC_E,
            ].filter(Boolean)
          },
          (code) => {
            if (!active || !code) return;
            setFlashLine(true);
            setTimeout(() => setFlashLine(false), 400);
            // Move video to visible container
            const video = div.querySelector("video");
            if (video && containerRef.current && !containerRef.current.contains(video)) {
              containerRef.current.appendChild(video);
              video.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
            }
            setTimeout(() => { if (active) onDetected(code); }, 200);
          },
          () => {} // ignora erros de frame
        );

        // Move video para o container visível
        setTimeout(() => {
          if (!active) return;
          const video = div.querySelector("video");
          if (video && containerRef.current) {
            containerRef.current.appendChild(video);
            video.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
          }
          setStatus("ativo");
        }, 800);

      } catch (e) {
        if (!active) return;
        const msg = e.name === "NotAllowedError" || (e.message||"").includes("Permission")
          ? "Permissão de câmera negada. Toque no ícone de câmera na barra do navegador e permita o acesso."
          : e.name === "NotFoundError"
          ? "Nenhuma câmera encontrada neste dispositivo."
          : "Não foi possível acessar a câmera: " + (e.message || e);
        setErroMsg(msg);
        setStatus("erro");
      }
    };

    iniciar();

    return () => {
      active = false;
      if (scannerRef.current) {
        try { scannerRef.current.stop().catch(() => {}); } catch (_) {}
      }
      // Remove div temporário
      const div = document.getElementById(divId);
      if (div) try { document.body.removeChild(div); } catch (_) {}
    };
  }, []);

  return (
    <div className="modal-overlay" style={{ zIndex: 300, background: "rgba(0,0,0,.95)", padding: 0 }}>
      <div style={{ width: "100%", maxWidth: 460, display: "flex", flexDirection: "column", borderRadius: 18, overflow: "hidden", background: "#11141e", border: "1px solid #2a2f45" }}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", borderBottom: "1px solid #1e2235" }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: "#e8eaf0", display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 20 }}>📷</span> Escanear Código de Barras
          </div>
          <button className="btn btn-ghost" onClick={onClose} style={{ padding: "6px 14px", fontSize: 13 }}>✕ Fechar</button>
        </div>

        {/* Viewfinder */}
        <div ref={containerRef} style={{ position: "relative", width: "100%", background: "#000", aspectRatio: "4/3", maxHeight: 340, overflow: "hidden" }}>

          {status === "ativo" && (
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 2 }}>
              <div style={{ position: "relative", width: "72%", height: 110 }}>
                {[[{top:0,left:0},{borderTopLeftRadius:4}],[{top:0,right:0},{borderTopRightRadius:4}],[{bottom:0,left:0},{borderBottomLeftRadius:4}],[{bottom:0,right:0},{borderBottomRightRadius:4}]].map(([pos, rad], i) => (
                  <div key={i} style={{ position:"absolute", width:22, height:22, borderColor: flashLine ? "#22c97a" : "#4f8ef7", borderStyle:"solid", borderWidth:0, ...Object.fromEntries(Object.entries(pos).map(([k])=>[`border${k.charAt(0).toUpperCase()+k.slice(1)}Width`,"3px"])), ...rad, transition:"border-color .2s" }} />
                ))}
                <style>{`@keyframes scanY{0%{top:6px}50%{top:calc(100% - 6px)}100%{top:6px}}.scanbar{position:absolute;left:6px;right:6px;height:2px;background:linear-gradient(90deg,transparent,${flashLine?"#22c97a":"#4f8ef7"},transparent);animation:scanY 1.8s ease-in-out infinite;transition:background .2s}`}</style>
                <div className="scanbar" />
                <div style={{ position:"absolute", inset:-9999, background:"rgba(0,0,0,.45)", boxShadow:"0 0 0 9999px rgba(0,0,0,.45)", borderRadius:4 }} />
              </div>
            </div>
          )}

          {status === "iniciando" && (
            <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12, background:"rgba(0,0,0,.7)", zIndex:2 }}>
              <div style={{ fontSize:32 }}>📷</div>
              <div style={{ color:"#4f8ef7", fontSize:14, fontWeight:600 }}>Iniciando câmera...</div>
            </div>
          )}

          {status === "erro" && (
            <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12, background:"rgba(0,0,0,.85)", padding:24, zIndex:2 }}>
              <div style={{ fontSize:34 }}>🚫</div>
              <div style={{ color:"#e05260", fontWeight:700, fontSize:14 }}>Câmera indisponível</div>
              <div style={{ color:"#6b7499", fontSize:12, lineHeight:1.6, textAlign:"center" }}>{erroMsg}</div>
            </div>
          )}
        </div>

        {/* Rodapé */}
        <div style={{ padding:"14px 20px", textAlign:"center" }}>
          {status === "ativo"
            ? <div style={{ fontSize:12, color:"#6b7499", lineHeight:1.6 }}>Aponte a câmera para o código de barras.<br/>A leitura é <strong style={{color:"#4f8ef7"}}>automática</strong> — sem precisar tirar foto.</div>
            : status === "erro"
            ? <button className="btn btn-primary" onClick={onClose} style={{ width:"100%" }}>Fechar e digitar manualmente</button>
            : null
          }
        </div>
      </div>
    </div>
  );
}
